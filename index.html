<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>কুরআনুল কারীম - বাংলা অডিও ও আয়াত</title>
  <meta name="theme-color" content="#04241e">
  <meta name="description" content="আল-কুরআন ১১৪টি সূরার বাংলা অডিও, বিশুদ্ধ আরবি উসমানী তিলাওয়াত ও বাংলা অনুবাদ। সম্পূর্ণ অফলাইনে ব্যবহারযোগ্য।">
  
  <link rel="stylesheet" href="/src/style.css">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
</head>
<body>

  <!-- APP HEADER -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-wrapper">
        <div class="brand-icon">☪</div>
        <div class="brand-title-wrap">
          <h1>কুরআনুল কারীম</h1>
          <div class="arabic-subtitle">القرآن الكريم - বাংলা অডিও</div>
        </div>
      </div>
      <div class="header-status-badge" id="networkStatusBadge">
        <div class="status-dot"></div>
        <span>অফলাইন মোড</span>
      </div>
    </div>
  </header>

  <!-- MAIN VIEW -->
  <main class="main-content">
    
    <!-- SEARCH & FILTERS -->
    <section class="search-filter-section">
      <div class="search-box-wrapper">
        <span class="search-icon">🔍</span>
        <input 
          type="search" 
          id="searchInput" 
          class="search-input" 
          placeholder="সূরা খুঁজুন (যেমন: ফাতিহা, 001, বাকারা)..."
          autocomplete="off"
        >
      </div>

      <div class="filter-pills">
        <button class="filter-btn active" data-filter="all">সকল সূরা (১১৪)</button>
        <button class="filter-btn" data-filter="Meccan">মাক্কী (৮৬)</button>
        <button class="filter-btn" data-filter="Medinan">মাদানীয় (২৮)</button>
      </div>
    </section>

    <!-- SURAHS LIST -->
    <div class="surahs-grid" id="surahsContainer">
      <!-- Generated dynamically -->
    </div>

  </main>

  <!-- STICKY MINI PLAYER BAR -->
  <div class="mini-player-bar" id="miniPlayerBar">
    <div class="mini-player-progress">
      <div class="mini-progress-filled" id="miniProgressBar"></div>
    </div>
    <div class="mini-player-content">
      <div class="mini-surah-info" id="miniSurahInfo">
        <div class="mini-avatar" id="miniAvatar">📖</div>
        <div class="mini-text-details">
          <div class="mini-title" id="miniTitle">সূরা নির্বাচন করুন</div>
          <div class="mini-artist" id="miniArtist">বাংলা অডিও তেলাওয়াত</div>
        </div>
      </div>
      <div class="mini-controls">
        <button class="btn-ctrl" id="miniBtnPrev">⏮</button>
        <button class="btn-ctrl btn-ctrl-play-main" id="miniBtnPlay">▶</button>
        <button class="btn-ctrl" id="miniBtnNext">⏭</button>
      </div>
    </div>
  </div>

  <!-- FULL SCREEN PLAYER MODAL -->
  <div class="player-modal" id="playerModal">
    <div class="player-modal-header">
      <button class="btn-ctrl" id="btnClosePlayer" style="font-size: 1.5rem;">✕</button>
      <div style="font-size: 0.95rem; font-weight: 600; color: var(--gold-light);">এখন বাজছে</div>
      <button class="btn-ctrl" id="btnReadFromPlayer" title="আয়াত পড়ুন" style="font-size: 1.3rem;">📖</button>
    </div>

    <div class="player-body">
      <div class="medallion-container" id="medallionContainer">
        <div class="medallion-number" id="medallionNumber">সূরা ১</div>
        <div class="medallion-arabic" id="medallionArabic">الفاتحة</div>
        <div class="medallion-badge" id="medallionBadge">মাক্কী • ৭ আয়াত</div>
      </div>

      <div class="player-info-section">
        <div class="player-surah-title" id="playerSurahTitle">আল-ফাতিহা</div>
        <div class="player-surah-sub" id="playerSurahSub">সূচনা • Al-Fatihah</div>
        <div class="player-offlineTag" id="playerOfflineTag">⚡ অফলাইন অডিও সক্রিয়</div>
      </div>

      <!-- Scrubber -->
      <div class="scrubber-section">
        <input type="range" class="seek-slider" id="seekSlider" min="0" max="100" value="0">
        <div class="time-row">
          <span id="currentTimeDisplay">০০:০০</span>
          <span id="totalDurationDisplay">০০:০০</span>
        </div>
      </div>

      <!-- Main Controls -->
      <div class="main-controls-row">
        <button class="btn-sec-ctrl" id="btnRewind" title="১০ সেকেন্ড পেছনে">↺ 10s</button>
        <button class="btn-sec-ctrl" id="btnMainPrev" title="পূর্ববর্তী সূরা">⏮</button>
        <button class="btn-main-play" id="btnMainPlay">▶</button>
        <button class="btn-sec-ctrl" id="btnMainNext" title="পরবর্তী সূরা">⏭</button>
        <button class="btn-sec-ctrl" id="btnForward" title="১০ সেকেন্ড সামনে">10s ↻</button>
      </div>

      <!-- Extra Controls -->
      <div class="secondary-options-row">
        <button class="opt-btn" id="btnSpeed">1x</button>
        <button class="opt-btn active" id="btnRepeat">🔁 সকল সূরা</button>
      </div>
    </div>
  </div>

  <!-- AYAH BY AYAH READER MODAL -->
  <div class="ayah-modal" id="ayahModal">
    <div class="ayah-modal-header">
      <button class="btn-ctrl" id="btnCloseAyah" style="font-size: 1.5rem;">✕</button>
      <div style="text-align: center;">
        <div style="font-weight: 700; color: var(--gold-light);" id="ayahModalTitle">আল-ফাতিহা</div>
        <div style="font-size: 0.78rem; color: var(--text-muted);" id="ayahModalSubtitle">৭ আয়াত • মাক্কী</div>
      </div>
      <div id="ayahCacheBadge" style="font-size: 0.75rem; color: var(--accent-green); background: rgba(0,0,0,0.3); padding: 4px 8px; border-radius: 10px;">
        💾 অফলাইন
      </div>
    </div>

    <div class="ayah-modal-body" id="ayahModalBody">
      <!-- Dynamic Ayahs rendered here -->
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
