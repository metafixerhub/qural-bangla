name: Build Quran Audio Bangla APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Quran Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android Licenses & Prepare SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install npm dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug -x test -x lint --no-daemon 2>&1 | tee build.log || {
            echo "==================== GRADLE ERROR SUMMARY ===================="
            grep -A 40 "What went wrong" build.log || tail -n 60 build.log
            exit 1
          }

      - name: Prepare APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Quran-Audio-Bangla-v1.0.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Audio-Bangla-APK
          path: Quran-Audio-Bangla-v1.0.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Quran Audio Bangla v1.0.0"
          draft: false
          prerelease: false
          body: |
            ## কুরআনুল কারীম (Quran Audio Bangla) - Release v1.0.0

            ### 📱 Direct Download
            Direct 1-click APK download (no login or unzipping needed):
            - **Quran-Audio-Bangla-v1.0.apk**

            ### ✨ Key Features
            - **114 Surahs Offline Audio:** Full playback with seekbar, speed control, repeat modes.
            - **Ayah-by-Ayah Arabic & Bangla:** Live AlQuran Cloud API + automatic offline caching.
            - **Background Audio:** Play audio while screen is locked or browsing other apps.
            - **Islamic Design:** Emerald green & gold UI with authentic Arabic Uthmani script.
          files: |
            Quran-Audio-Bangla-v1.0.apk
          token: ${{ secrets.GITHUB_TOKEN }}
