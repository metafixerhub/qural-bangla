name: Build Quran Audio Bangla APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Quran Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android Licenses & Prepare SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install npm dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug -x test -x lint --no-daemon 2>&1 | tee build.log || {
            echo "==================== GRADLE ERROR SUMMARY ===================="
            grep -A 40 "What went wrong" build.log || tail -n 60 build.log
            exit 1
          }

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Audio-Bangla-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
