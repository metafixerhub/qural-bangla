name: Build Quran Audio Bangla APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Quran Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android Licenses & Prepare SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install npm dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug -x test -x lint --no-daemon > build.log 2>&1 || {
            echo "==================== BUILD LOG OUTPUT ===================="
            cat build.log
            exit 1
          }

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Audio-Bangla-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "Quran Audio Bangla v1.0.3"
          draft: false
          prerelease: false
          body: |
            ## কুরআনুল কারীম (Quran Audio Bangla) - Release v1.0.3

            ### 📱 Direct Download
            Direct 1-click APK download:
            - Click **app-debug.apk** below to download directly to your Android device.

            ### ✨ What's New in v1.0.3
            - **🎧 Uninterrupted Background Audio:** Audio now plays continuously when the screen is locked, in the background, or while using other apps via native Android Foreground Service with `WAKE_LOCK` and media playback support.
            - **🔒 Lock Screen & Notification Controls:** Integrated lockscreen media controls (play, pause, next, previous, seek) and notification tray controls.
            - **🕌 Official Authentic App Icon:** Applied the official Al-Quran Al-Kareem illuminated rosette icon across all Android launcher formats and web assets.
            - **📱 Mobile Screen Close Button Fix:** Shifted the reader close button down with safe-area support (`env(safe-area-inset-top)`) to avoid camera notch/status bar overlap.
            - **🎵 Auto-Open Player & Live Timings:** Automatically opens player view on play with elapsed time, countdown remaining time, and total duration.
            - **🔄 Playback Session Persistence:** Remembers where you stopped listening when leaving the app or browsing elsewhere, with a 1-tap "Resume Session" banner.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
